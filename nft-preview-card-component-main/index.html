<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Frontend Mentor | NFT preview card component</title>
</head>
<body>
  <section>
    <div id="image">
      <div id="hoverView"><img id="eye" src="images/icon-view.svg" alt="view"></div>
    </div>

    <h2>Equilibrium #3429</h2>
    <p>
      Our Equilibrium collection promotes balance and calm
    </p>

    <ul id="info">
      <li id="value">0.041ETH</li>
      <li id="timeLeft">3 days left</li>
    </ul>

    <hr>

    <div id="creator">
      <img src="images/image-avatar.png" alt="Jules Wyvern">
      <small>Creation of <strong>Jules Wyvern</strong></small>
    </div>
  </section>

  <div id="imageViewer">
    <strong id="close">X</strong>
  </div>

  <script src="js/index.js"></script>
</body>
</html>
